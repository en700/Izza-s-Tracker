<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pookie's Dental Hygiene Program — Sign in</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#f5f6fa; --card:#fff; --text:#1d2433; --muted:#667085; --line:#dfe3ea; --accent:#3b5bdb; --danger:#c92a2a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151c; --card:#1b2029; --text:#e7eaf0; --muted:#98a2b3; --line:#2c3340; --accent:#7c94f5; --danger:#ff8787; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; }
  form { width:100%; max-width:340px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 24px; box-shadow:0 8px 30px rgba(0,0,0,.06); }
  h1 { font-size:20px; margin:0 0 4px; }
  p { margin:0 0 20px; color:var(--muted); font-size:13px; }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  input { width:100%; padding:10px 12px; font:inherit; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { width:100%; margin-top:14px; padding:10px; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  button[disabled] { opacity:.6; cursor:default; }
  .err { color:var(--danger); font-size:13px; min-height:18px; margin-top:10px; }
  .logo { width:40px; height:40px; margin-bottom:12px; }
  .logo .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
  .logo .s2 { animation-delay: .9s; } .logo .s3 { animation-delay: 1.7s; }
  @keyframes twinkle { 0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); } 50% { opacity: .35; transform: scale(.55) rotate(45deg); } }
  @media (prefers-reduced-motion: reduce) { .logo .spark { animation: none; } }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#3b5bdb"/><path d="M10.2 6.5C7.3 6.5 5.8 8.9 5.8 11.8c0 3 1.5 5 2.5 7.6.9 2.3 1.2 6.1 3.1 6.1 1.8 0 2-4.4 3-5.9.5-.8 1-1.1 1.6-1.1s1.1.3 1.6 1.1c1 1.5 1.2 5.9 3 5.9 1.9 0 2.2-3.8 3.1-6.1 1-2.6 2.5-4.6 2.5-7.6 0-2.9-1.5-5.3-4.4-5.3-2.3 0-3.6 1.3-5.8 1.3s-3.5-1.3-5.8-1.3z" fill="#fff"/><path d="M9.4 10.6c.3-1 1-1.6 2-1.8" fill="none" stroke="#ffd43b" stroke-width="1.6" stroke-linecap="round"/><path class="spark s1" d="M25.6 2.4000000000000004Q25.6 6.2 29.400000000000002 6.2Q25.6 6.2 25.6 10.0Q25.6 6.2 21.8 6.2Q25.6 6.2 25.6 2.4000000000000004Z" fill="#ffd43b"/><path class="spark s2" d="M6.4 21.6Q6.4 23.8 8.600000000000001 23.8Q6.4 23.8 6.4 26.0Q6.4 23.8 4.2 23.8Q6.4 23.8 6.4 21.6Z" fill="#ffd43b"/><path class="spark s3" d="M27.2 12.0Q27.2 13.4 28.599999999999998 13.4Q27.2 13.4 27.2 14.8Q27.2 13.4 25.8 13.4Q27.2 13.4 27.2 12.0Z" fill="#ffd43b"/></svg>
  <h1>Pookie&rsquo;s Dental Hygiene Program</h1>
  <p>This page is private. Enter the password to continue.</p>
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  <button id="go" type="submit">Sign in</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
  const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = ''; go.disabled = true; go.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value }) });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || 'Sign-in failed');
      const next = new URLSearchParams(location.search).get('next');
      location.replace(next && next.startsWith('/') && !next.startsWith('//') ? next : '/');
    } catch (e2) {
      err.textContent = e2.message; go.disabled = false; go.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>

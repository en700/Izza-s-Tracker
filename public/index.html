<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Level 1 Schedule</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#3b5bdb"/><path d="M9 8h3v13h7v3H9z" fill="#fff"/><path d="M21 8h3v9h-3z" fill="#ffd43b"/></svg>
      <div>
        <h1>Level 1 Schedule</h1>
        <div class="sub" id="term-sub">Dental Hygiene</div>
      </div>
    </div>
    <div class="term-progress" id="term-progress" aria-label="Term progress"></div>
    <div class="top-actions">
      <span class="sync" id="sync-status" title="Where your notes and tasks are saved"></span>
      <button class="btn primary" data-action="new-item" title="Add an assignment, due date or event (N)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg><span>New</span>
      </button>
      <button class="btn" data-action="import" title="Import events (.ics, .csv, .json)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10M6 9l4 4 4-4M4 16h12"/></svg><span>Import</span>
      </button>
      <button class="btn" data-action="print" title="Print timetable (P)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 8V3h8v5M6 14H4V8h12v6h-2M6 12h8v5H6z"/></svg><span>Print</span>
      </button>
      <button class="btn icon" data-action="settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/></svg>
      </button>
      <button class="btn icon" data-action="logout" title="Sign out" aria-label="Sign out">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 4H4v12h4M13 6l4 4-4 4M17 10H8"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-view="week">Week</button>
    <button role="tab" data-view="month">Month</button>
    <button role="tab" data-view="agenda">Agenda</button>
    <button role="tab" data-view="tasks">Tasks <span class="count" id="task-count"></span></button>
    <button role="tab" data-view="notes">Notes</button>
    <button role="tab" data-view="courses">Courses</button>
  </nav>

  <main id="view" class="view" tabindex="-1"></main>
</div>

<div id="modal-root"></div>
<div id="print-root" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js" type="module"></script>
</body>
</html>

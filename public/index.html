<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Pookie's Dental Hygiene Program — Level 1</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#3b5bdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pookie's DH">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#3b5bdb"/><path d="M10.2 6.5C7.3 6.5 5.8 8.9 5.8 11.8c0 3 1.5 5 2.5 7.6.9 2.3 1.2 6.1 3.1 6.1 1.8 0 2-4.4 3-5.9.5-.8 1-1.1 1.6-1.1s1.1.3 1.6 1.1c1 1.5 1.2 5.9 3 5.9 1.9 0 2.2-3.8 3.1-6.1 1-2.6 2.5-4.6 2.5-7.6 0-2.9-1.5-5.3-4.4-5.3-2.3 0-3.6 1.3-5.8 1.3s-3.5-1.3-5.8-1.3z" fill="#fff"/><path d="M9.4 10.6c.3-1 1-1.6 2-1.8" fill="none" stroke="#ffd43b" stroke-width="1.6" stroke-linecap="round"/><path class="spark s1" d="M25.6 2.4000000000000004Q25.6 6.2 29.400000000000002 6.2Q25.6 6.2 25.6 10.0Q25.6 6.2 21.8 6.2Q25.6 6.2 25.6 2.4000000000000004Z" fill="#ffd43b"/><path class="spark s2" d="M6.4 21.6Q6.4 23.8 8.600000000000001 23.8Q6.4 23.8 6.4 26.0Q6.4 23.8 4.2 23.8Q6.4 23.8 6.4 21.6Z" fill="#ffd43b"/><path class="spark s3" d="M27.2 12.0Q27.2 13.4 28.599999999999998 13.4Q27.2 13.4 27.2 14.8Q27.2 13.4 25.8 13.4Q27.2 13.4 27.2 12.0Z" fill="#ffd43b"/></svg>
      <div>
        <h1>Pookie&rsquo;s Dental Hygiene Program</h1>
        <div class="sub"><span class="levels" id="levels" aria-label="Level 1 of 4"></span><span id="term-sub">Level 1 of 4</span></div>
      </div>
    </div>
    <div class="term-progress" id="term-progress" aria-label="Term progress"></div>
    <div class="top-actions">
      <span class="sync" id="sync-status" title="Where your notes and tasks are saved"></span>
      <button class="btn levelup locked" data-action="level-up" id="levelup-btn" title="LEVEL UP!"><span class="lu-ico" id="levelup-ico">🔒</span><b>LEVEL UP!</b><span class="lu-count" id="levelup-count"></span></button>
      <button class="btn primary btn-new" data-action="new-item" title="Add an event, due date, exam or reminder (N)" aria-keyshortcuts="N">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg><span>New calendar entry</span><kbd>N</kbd>
      </button>
      <button class="btn" data-action="import" title="Import events (.ics, .csv, .json)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10M6 9l4 4 4-4M4 16h12"/></svg><span>Import</span>
      </button>
      <button class="btn" data-action="print" title="Print timetable (P)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 8V3h8v5M6 14H4V8h12v6h-2M6 12h8v5H6z"/></svg><span>Print</span>
      </button>
      <button class="btn icon" data-action="settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/></svg>
      </button>
      <button class="btn icon" data-action="logout" title="Sign out" aria-label="Sign out">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 4H4v12h4M13 6l4 4-4 4M17 10H8"/></svg>
      </button>
      <button class="btn icon menu-btn" data-action="menu" title="Menu" aria-label="Open menu" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 6h13M3.5 10h13M3.5 14h13"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-view="week"><svg class="tab-ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M7 2.5v3M13 2.5v3M7.5 11.5h1M11.5 11.5h1M7.5 14h1"/></svg><span class="tab-lbl">Week</span></button>
    <button role="tab" data-view="month"><svg class="tab-ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M7 2.5v3M13 2.5v3M6.5 11h1M9.5 11h1M12.5 11h1M6.5 14h1M9.5 14h1M12.5 14h1"/></svg><span class="tab-lbl">Month</span></button>
    <button role="tab" data-view="agenda"><svg class="tab-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5h10M7 10h10M7 15h10"/><circle cx="3.6" cy="5" r=".9"/><circle cx="3.6" cy="10" r=".9"/><circle cx="3.6" cy="15" r=".9"/></svg><span class="tab-lbl">Agenda</span></button>
    <button role="tab" data-view="tasks"><svg class="tab-ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="M6.5 10.2l2.4 2.4 4.8-5"/></svg><span class="tab-lbl">Tasks</span> <span class="count" id="task-count"></span></button>
    <button role="tab" data-view="notes"><svg class="tab-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.8h7l3.2 3.2v11.2H5z"/><path d="M12 2.8V6h3.2M7.5 10h5M7.5 13h5"/></svg><span class="tab-lbl">Notes</span></button>
    <button role="tab" data-view="courses"><svg class="tab-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 7.5L10 4l7.5 3.5L10 11z"/><path d="M5.5 9v4c1.2 1.3 2.8 2 4.5 2s3.3-.7 4.5-2V9"/></svg><span class="tab-lbl">Courses</span></button>
  </nav>

  <main id="view" class="view" tabindex="-1"></main>
</div>

<div id="modal-root"></div>
<div id="print-root" aria-hidden="true"></div>
<button class="fab" data-action="new-item" aria-label="New calendar entry" title="New calendar entry">
  <svg class="smiley fab-smile" viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="smiley-mouth-fab"><path d="M6.6 13h10.8c0 3.4-2.5 5.5-5.4 5.5S6.6 16.4 6.6 13z"/></clipPath></defs><circle cx="12" cy="12" r="10" fill="#ffd43b" stroke="#e8a400" stroke-width="1"/><circle cx="8.6" cy="10" r="1.4" fill="#5c3b00"/><circle cx="15.4" cy="10" r="1.4" fill="#5c3b00"/><circle cx="6.6" cy="13.4" r="1.2" fill="#ff8fab" opacity=".7"/><circle cx="17.4" cy="13.4" r="1.2" fill="#ff8fab" opacity=".7"/><path class="smile" d="M7.6 14c1 2 2.6 3 4.4 3s3.4-1 4.4-3" fill="none" stroke="#5c3b00" stroke-width="1.7" stroke-linecap="round"/><g class="grin"><path d="M6.6 13h10.8c0 3.4-2.5 5.5-5.4 5.5S6.6 16.4 6.6 13z" fill="#5c3b00"/><g clip-path="url(#smiley-mouth-fab)"><ellipse cx="12" cy="18" rx="3.2" ry="1.6" fill="#ff8fab"/><rect x="6.4" y="12.8" width="11.2" height="2.7" rx=".6" fill="#fff"/><path d="M9.3 13v2.5M12 13v2.5M14.7 13v2.5" stroke="#d9cfc0" stroke-width=".45"/><rect class="gleam" x="5" y="11.5" width="1.3" height="5.5" fill="#fff" opacity=".95" transform="skewX(-20)"/></g><g class="glints" fill="#fff" stroke="#f2c200" stroke-width=".25"><path class="glint g1" d="M17.9 10.3Q17.9 12.0 19.599999999999998 12.0Q17.9 12.0 17.9 13.7Q17.9 12.0 16.2 12.0Q17.9 12.0 17.9 10.3Z"/><path class="glint g2" d="M5.9 15.299999999999999Q5.9 16.4 7.0 16.4Q5.9 16.4 5.9 17.5Q5.9 16.4 4.800000000000001 16.4Q5.9 16.4 5.9 15.299999999999999Z"/><path class="glint g3" d="M13.4 10.5Q13.4 11.3 14.200000000000001 11.3Q13.4 11.3 13.4 12.100000000000001Q13.4 11.3 12.6 11.3Q13.4 11.3 13.4 10.5Z"/></g></g></svg><span>New calendar entry</span>
</button>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
